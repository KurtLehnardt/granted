name: canon-sync

# CAN-02 — scheduled grants.gov ingestion into the Supabase Canon store.
# Runs scaffold/scripts/canon/ingest-grants.mjs on a cron: fetch -> normalize
# -> embed (OpenAI, 512-dim) -> upsert into Supabase under a new
# snapshot_version. See scaffold/scripts/canon/keywords.mjs for the current
# keyword/category coverage.
#
# FAILURE MODEL (§4.4 / §4.6): per-keyword and per-record failures inside the
# script degrade + alarm (GitHub Actions `::warning::`/`::error::`
# annotations) without aborting the run — see ingest-grants.mjs's `runSource`.
# The job itself only goes red when the script's own exit code is non-zero,
# which it sets ONLY when a run wrote zero opportunities (a fully failed
# sync) — a degraded-but-partial run stays green with visible warnings, per
# "never fails the whole sync silently."
#
# SECRETS: OPENAI_API_KEY and FUNDFINDER_DB_PASSWORD come from the repo's
# Actions secrets (Settings > Secrets and variables > Actions). Never echoed;
# the script itself never logs them either.

on:
  schedule:
    # Daily at 09:00 UTC (default cadence — §4.4 documents a per-source
    # refresh cadence; grants.gov's default here is once/day). Adjust the
    # cron if a different cadence is decided.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      keywords:
        description: "Comma-separated keyword override (smoke test / partial run). Leave blank for the full broadened list."
        required: false
        default: ""
      categories:
        description: "Comma-separated keyword category override (see scaffold/scripts/canon/keywords.mjs). Leave blank for the full list."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # Never run two syncs at once — they'd both upsert the same snapshot
  # version and race on it.
  group: canon-sync
  cancel-in-progress: false

jobs:
  ingest-grants:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: scaffold
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scaffold/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run grants.gov ingestion
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FUNDFINDER_DB_PASSWORD: ${{ secrets.FUNDFINDER_DB_PASSWORD }}
          # Optional overrides — see lib/canon/store.ts for defaults (pooler
          # host, session-vs-transaction port, project ref/user).
          FUNDFINDER_DB_HOST: ${{ secrets.FUNDFINDER_DB_HOST }}
          FUNDFINDER_DB_PORT: ${{ secrets.FUNDFINDER_DB_PORT }}
          FUNDFINDER_DB_PROJECT_REF: ${{ secrets.FUNDFINDER_DB_PROJECT_REF }}
          KEYWORDS_INPUT: ${{ github.event.inputs.keywords }}
          CATEGORIES_INPUT: ${{ github.event.inputs.categories }}
        run: |
          ARGS=()
          if [ -n "$KEYWORDS_INPUT" ]; then
            ARGS+=("--keywords=$KEYWORDS_INPUT")
          elif [ -n "$CATEGORIES_INPUT" ]; then
            ARGS+=("--categories=$CATEGORIES_INPUT")
          fi
          node --import tsx scripts/canon/ingest-grants.mjs "${ARGS[@]}"
