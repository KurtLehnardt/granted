# The form behind "Report a problem". Granted's own reports (Settings ->
# Problems & logs, "Report this problem" under an error, the tray menu and the
# installer) open a pre-filled new issue whose body uses these same headings
# (scaffold/lib/errorLog/issueUrl.ts, scaffold/scripts/windows/report-problem.ps1,
# installer/src/shared/reportProblem.ts), so they read the same as one filed here.
name: Report a problem
description: Something in Granted went wrong. API keys, email addresses and your user folder are removed from Granted's own reports; please check anything you paste here too.
title: "Problem: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. The quickest way: in Granted, open **Settings -> Problems & logs -> Report a problem** (or click **Report this problem** under the error). It fills this in for you, with secrets removed.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What were you doing, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: error-id
    attributes:
      label: Error ID
      description: Shown next to the error, like E-7K3F9Q. Leave blank if there wasn't one.
      placeholder: E-XXXXXX
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Granted version (Settings -> About Granted), operating system, model provider type (never the key) and search mode.
      value: |
        - Granted version:
        - Operating system:
        - Model provider:
        - Search mode:
        - Reported from:
  - type: textarea
    id: recent-errors
    attributes:
      label: Recent errors
      description: Settings -> Problems & logs -> Copy log copies Granted's error log with API keys, emails and your user folder removed. Please look it over before pasting.
      render: text
